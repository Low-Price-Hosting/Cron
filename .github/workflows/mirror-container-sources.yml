name: Sync official container production sources

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        type: choice
        required: true
        default: all
        options: [all, Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distribution: [Ubuntu, Debian, Centos, Alpine, Fedora, AlmaLinux, ArchLinux, RockyLinux]
    concurrency:
      group: production-sources-${{ matrix.distribution }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Sync ${{ matrix.distribution }} production code
        if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.distribution
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISTRO: ${{ matrix.distribution }}
        run: bash "$DISTRO/sync.sh"

  notify-container:
    needs: sync
    if: needs.sync.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start Container production builds
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE: ${{ inputs.source || 'all' }}
        run: bash scripts/notify-container.sh
