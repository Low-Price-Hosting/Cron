name: Mirror Linux container sources

on:
  push:
    paths:
      - .github/workflows/mirror-container-sources.yml
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        type: choice
        required: true
        default: all
        options:
          - all
          - Ubuntu
          - Debian
          - Centos
          - Alpine
          - Fedora
          - AlmaLinux
          - ArchLinux
          - RockyLinux

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Ubuntu
            upstream: https://git.launchpad.net/cloud-images/+oci/ubuntu-base
          - name: Debian
            upstream: https://github.com/debuerreotype/docker-debian-artifacts.git
          - name: Centos
            upstream: https://gitlab.com/redhat/centos-stream/release-engineering/kickstarts.git
          - name: Alpine
            upstream: https://github.com/alpinelinux/docker-alpine.git
          - name: Fedora
            upstream: https://github.com/fedora-cloud/docker-brew-fedora.git
          - name: AlmaLinux
            upstream: https://github.com/AlmaLinux/container-images.git
          - name: ArchLinux
            upstream: https://github.com/archlinux/archlinux-docker.git
          - name: RockyLinux
            upstream: https://github.com/rocky-linux/sig-cloud-instance-images.git
    concurrency:
      group: mirror-${{ matrix.name }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - name: Mirror ${{ matrix.name }}
        if: ${{ matrix.name != 'Ubuntu' && (github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.name) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN}}
          SOURCE_NAME: ${{ matrix.name }}
          SOURCE_URL: ${{ matrix.upstream }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'GH_TOKEN repository secret is required.' >&2
            exit 1
          fi

          org=Low-Price-Hosting
          target="https://github.com/$org/$SOURCE_NAME.git"
          marker="Managed by $org/Cron; upstream: $SOURCE_URL"

          git init --bare source.git
          if ! timeout 20m git -c protocol.version=1 -C source.git fetch \
            --atomic --no-tags "$SOURCE_URL" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; then
            echo 'Full fetch failed; fetching upstream refs individually.' >&2
            git -c protocol.version=1 ls-remote --refs --heads --tags \
              "$SOURCE_URL" | awk '{print $2}' > upstream-refnames.txt
            test -s upstream-refnames.txt
            while read -r ref; do
              fetched=false
              for attempt in 1 2 3; do
                if timeout 10m git -c protocol.version=1 -C source.git \
                  fetch --atomic --no-tags "$SOURCE_URL" "+$ref:$ref"; then
                  fetched=true
                  break
                fi
                sleep "$((attempt * 10))"
              done
              if [ "$fetched" != true ]; then
                echo "Could not fetch $ref from $SOURCE_URL." >&2
                exit 1
              fi
            done < upstream-refnames.txt
            git -C source.git for-each-ref --format='%(refname)' \
              refs/heads refs/tags | sort > local-refnames.txt
            sort -o upstream-refnames.txt upstream-refnames.txt
            diff -u upstream-refnames.txt local-refnames.txt
          fi

          git -C source.git for-each-ref \
            --format='%(objectname) %(refname)' refs/heads refs/tags \
            | sort > local-refs.txt
          test -s local-refs.txt

          if description=$(gh api "repos/$org/$SOURCE_NAME" --jq '.description // ""' 2>/dev/null); then
            if [ "$description" != "$marker" ]; then
              if [[ "$description" == "Managed by $org/Cron; upstream: "* ]]; then
                gh api -X PATCH "repos/$org/$SOURCE_NAME" \
                  -f "description=$marker" --silent
              else
                echo "$org/$SOURCE_NAME exists but is not a Cron-managed mirror." >&2
                exit 1
              fi
            fi
          else
            gh api -X POST "orgs/$org/repos" \
              -f "name=$SOURCE_NAME" -f "description=$marker" \
              -F private=false -F auto_init=false --silent
          fi

          gh api -X PUT "repos/$org/$SOURCE_NAME/actions/permissions" \
            -F enabled=false --silent

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          push_refs() {
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=http.version \
            GIT_CONFIG_VALUE_1=HTTP/1.1 \
              git -C source.git push --force "$target" "$@"
          }
          push_ref() {
            push_refs "$1:$2"
          }

          git ls-remote --refs --heads --tags "$target" \
            | awk '{print $1, $2}' | sort > previous-refs.txt
          declare -A previous_refs=()
          while read -r oid ref; do
            previous_refs["$ref"]="$oid"
          done < previous-refs.txt

          # Send each ref separately. If one branch is too large for GitHub's
          # 2 GiB push limit, recursively send commits along its history.
          push_commits() {
            local first=$1 last=$2 destination=$3 middle attempt
            if push_ref "${commits[$last]}" "$destination"; then
              sleep 10
              return 0
            fi
            if (( first == last )); then
              for attempt in 2 3; do
                sleep "$((attempt * 15))"
                if push_ref "${commits[$last]}" "$destination"; then
                  sleep 10
                  return 0
                fi
              done
              echo "Failed to push commit ${commits[$last]} to $destination." >&2
              return 1
            fi
            middle=$(((first + last) / 2))
            push_commits "$first" "$middle" "$destination"
            push_commits "$((middle + 1))" "$last" "$destination"
          }

          while read -r oid ref; do
            [[ "$ref" == refs/heads/* ]] || continue
            [[ "${previous_refs[$ref]:-}" == "$oid" ]] && continue
            mapfile -t commits < <(git -C source.git rev-list --topo-order --reverse "$ref")
            test "${#commits[@]}" -gt 0
            push_commits 0 "$((${#commits[@]} - 1))" "$ref"
          done < local-refs.txt

          while read -r oid ref; do
            [[ "$ref" == refs/tags/* ]] || continue
            [[ "${previous_refs[$ref]:-}" == "$oid" ]] && continue
            pushed=false
            for attempt in 1 2 3; do
              if push_ref "$ref" "$ref"; then
                pushed=true
                sleep 10
                break
              fi
              sleep "$((attempt * 15))"
            done
            test "$pushed" = true
          done < local-refs.txt

          default_ref=$(git -c protocol.version=1 ls-remote --symref "$SOURCE_URL" HEAD \
            | awk '$1 == "ref:" && $3 == "HEAD" {print $2}' || true)
          if [ -z "$default_ref" ]; then
            for candidate in main master; do
              if git -C source.git show-ref --verify --quiet "refs/heads/$candidate"; then
                default_ref="refs/heads/$candidate"
                break
              fi
            done
          fi
          if [[ "$default_ref" == refs/heads/* ]]; then
            gh api -X PATCH "repos/$org/$SOURCE_NAME" \
              -f "default_branch=${default_ref#refs/heads/}" --silent
          fi

          # Delete refs removed upstream only after all current refs arrived.
          while read -r oid ref; do
            if ! git -C source.git show-ref --verify --quiet "$ref"; then
              push_ref '' "$ref"
              sleep 10
            fi
          done < previous-refs.txt

          git ls-remote --refs --heads --tags "$target" \
            | awk '{print $1, $2}' | sort > target-refs.txt
          diff -u local-refs.txt target-refs.txt

      - name: Mirror Ubuntu one ref at a time
        if: ${{ matrix.name == 'Ubuntu' && (github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.name) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_URL: ${{ matrix.upstream }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          org=Low-Price-Hosting
          name=Ubuntu
          target="https://github.com/$org/$name.git"
          marker="Managed by $org/Cron; upstream: $SOURCE_URL"

          # This repository contains OCI layers in Git. Fetching every ref in
          # one checkout exceeds the standard runner's available disk space.
          git -c protocol.version=1 ls-remote --refs --heads --tags "$SOURCE_URL" \
            | awk '{print $1, $2}' | sort > upstream-refs.txt
          test -s upstream-refs.txt
          default_ref=$(git -c protocol.version=1 ls-remote --symref "$SOURCE_URL" HEAD \
            | awk '$1 == "ref:" && $3 == "HEAD" {print $2}' || true)
          if [[ "$default_ref" != refs/heads/* ]]; then
            default_ref=refs/heads/main
          fi
          awk -v d="$default_ref" '$2 == d { found=1 } END { exit !found }' upstream-refs.txt

          if description=$(gh api "repos/$org/$name" --jq '.description // ""' 2>/dev/null); then
            if [ "$description" != "$marker" ]; then
              if [[ "$description" == "Managed by $org/Cron; upstream: "* ]]; then
                gh api -X PATCH "repos/$org/$name" \
                  -f "description=$marker" --silent
              else
                echo "$org/$name exists but is not a Cron-managed mirror." >&2
                exit 1
              fi
            fi
          else
            gh api -X POST "orgs/$org/repos" \
              -f "name=$name" -f "description=$marker" \
              -F private=false -F auto_init=false --silent
          fi
          gh api -X PUT "repos/$org/$name/actions/permissions" \
            -F enabled=false --silent

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          push_refs() {
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=http.version \
            GIT_CONFIG_VALUE_1=HTTP/1.1 \
              git -C source.git push --force "$target" "$@"
          }
          push_ref() {
            push_refs "$1:$2"
          }

          git ls-remote --refs --heads --tags "$target" \
            | awk '{print $1, $2}' | sort > previous-refs.txt
          declare -A previous_refs=()
          while read -r oid ref; do
            previous_refs["$ref"]="$oid"
          done < previous-refs.txt

          push_commits() {
            local first=$1 last=$2 destination=$3 middle attempt
            if push_ref "${commits[$last]}" "$destination"; then
              sleep 11
              return 0
            fi
            if (( first == last )); then
              for attempt in 2 3; do
                sleep "$((attempt * 15))"
                if push_ref "${commits[$last]}" "$destination"; then
                  sleep 11
                  return 0
                fi
              done
              echo "A single Ubuntu commit could not be pushed to $destination." >&2
              return 1
            fi
            middle=$(((first + last) / 2))
            push_commits "$first" "$middle" "$destination"
            push_commits "$((middle + 1))" "$last" "$destination"
          }

          awk -v d="$default_ref" '$2 == d' upstream-refs.txt > pending-refs.txt
          awk -v d="$default_ref" '$2 != d' upstream-refs.txt >> pending-refs.txt
          while read -r oid ref; do
            [[ "${previous_refs[$ref]:-}" == "$oid" ]] && continue
            echo "Updating $ref from $SOURCE_URL"
            git init --bare --initial-branch=main source.git
            fetched=false
            for attempt in 1 2 3; do
              if timeout 20m git -c protocol.version=1 -C source.git fetch \
                --atomic --no-tags "$SOURCE_URL" "+$ref:$ref"; then
                fetched=true
                break
              fi
              sleep "$((attempt * 15))"
            done
            test "$fetched" = true
            [[ "$(git -C source.git rev-parse "$ref")" == "$oid" ]]

            pushed=false
            for attempt in 1 2 3; do
              if push_ref "$ref" "$ref"; then
                pushed=true
                sleep 11
                break
              fi
              sleep "$((attempt * 15))"
            done
            if [ "$pushed" = false ]; then
              commit=$(git -C source.git rev-parse "${ref}^{commit}")
              mapfile -t commits < <(git -C source.git rev-list \
                --topo-order --reverse "$commit")
              ((${#commits[@]}))
              push_commits 0 "$((${#commits[@]} - 1))" "$ref"
              push_ref "$ref" "$ref"
              sleep 11
            fi
            rm -rf source.git
          done < pending-refs.txt

          gh api -X PATCH "repos/$org/$name" \
            -f "default_branch=${default_ref#refs/heads/}" --silent
          git init --bare --initial-branch=main source.git
          stale_refs=()
          delete_batch() {
            local attempt
            for attempt in 1 2 3; do
              if push_refs "${stale_refs[@]}"; then
                stale_refs=()
                sleep 11
                return 0
              fi
              sleep "$((attempt * 15))"
            done
            echo 'Could not remove stale Ubuntu refs.' >&2
            return 1
          }
          while read -r oid ref; do
            if ! awk -v r="$ref" '$2 == r { found=1 } END { exit !found }' upstream-refs.txt; then
              stale_refs+=(":$ref")
              if (( ${#stale_refs[@]} == 50 )); then
                delete_batch
              fi
            fi
          done < previous-refs.txt
          if (( ${#stale_refs[@]} )); then
            delete_batch
          fi
          rm -rf source.git

          git ls-remote --refs --heads --tags "$target" \
            | awk '{print $1, $2}' | sort > target-refs.txt
          diff -u upstream-refs.txt target-refs.txt

  notify-container:
    needs: mirror
    if: ${{ needs.mirror.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Container of source updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE: ${{ inputs.source || 'all' }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          jq -n --arg source "$SOURCE" \
            '{event_type: "source-mirrors-updated", client_payload: {distribution: $source}}' \
            | gh api -X POST repos/Low-Price-Hosting/Container/dispatches --input -
