name: Mirror Linux container sources

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source:
        type: choice
        required: true
        default: all
        options:
          - all
          - Ubuntu
          - Debian
          - Centos
          - Alpine
          - Fedora
          - AlmaLinux
          - ArchLinux
          - RockyLinux

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Ubuntu
            upstream: https://git.launchpad.net/cloud-images/+oci/ubuntu-base
          - name: Debian
            upstream: https://github.com/debuerreotype/docker-debian-artifacts.git
          - name: Centos
            upstream: https://pagure.io/centos-sig-hyperscale/containers-releng.git
          - name: Alpine
            upstream: https://github.com/alpinelinux/docker-alpine.git
          - name: Fedora
            upstream: https://github.com/fedora-cloud/docker-brew-fedora.git
          - name: AlmaLinux
            upstream: https://github.com/AlmaLinux/container-images.git
          - name: ArchLinux
            upstream: https://gitlab.archlinux.org/archlinux/archlinux-docker.git
          - name: RockyLinux
            upstream: https://github.com/rocky-linux/sig-cloud-instance-images.git
    concurrency:
      group: mirror-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - name: Mirror ${{ matrix.name }}
        if: ${{ github.event_name == 'schedule' || inputs.source == 'all' || inputs.source == matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN}}
          SOURCE_NAME: ${{ matrix.name }}
          SOURCE_URL: ${{ matrix.upstream }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'GH_TOKEN repository secret is required.' >&2
            exit 1
          fi

          org=Low-Price-Hosting
          target="https://github.com/$org/$SOURCE_NAME.git"
          marker="Managed by $org/Cron; upstream: $SOURCE_URL"

          git init --bare source.git
          if ! timeout 20m git -c protocol.version=1 -C source.git fetch \
            --atomic --no-tags "$SOURCE_URL" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; then
            echo 'Full fetch failed; fetching upstream refs individually.' >&2
            git -c protocol.version=1 ls-remote --refs --heads --tags \
              "$SOURCE_URL" | awk '{print $2}' > upstream-refnames.txt
            test -s upstream-refnames.txt
            while read -r ref; do
              fetched=false
              for attempt in 1 2 3; do
                if timeout 10m git -c protocol.version=1 -C source.git \
                  fetch --atomic --no-tags "$SOURCE_URL" "+$ref:$ref"; then
                  fetched=true
                  break
                fi
                sleep "$((attempt * 10))"
              done
              if [ "$fetched" != true ]; then
                echo "Could not fetch $ref from $SOURCE_URL." >&2
                exit 1
              fi
            done < upstream-refnames.txt
            git -C source.git for-each-ref --format='%(refname)' \
              refs/heads refs/tags | sort > local-refnames.txt
            sort -o upstream-refnames.txt upstream-refnames.txt
            diff -u upstream-refnames.txt local-refnames.txt
          fi

          git -C source.git for-each-ref \
            --format='%(objectname) %(refname)' refs/heads refs/tags \
            | sort > local-refs.txt
          test -s local-refs.txt

          if description=$(gh api "repos/$org/$SOURCE_NAME" --jq '.description // ""' 2>/dev/null); then
            if [ "$description" != "$marker" ]; then
              echo "$org/$SOURCE_NAME exists but is not a Cron-managed mirror." >&2
              exit 1
            fi
          else
            gh api -X POST "orgs/$org/repos" \
              -f "name=$SOURCE_NAME" -f "description=$marker" \
              -F private=false -F auto_init=false --silent
          fi

          gh api -X PUT "repos/$org/$SOURCE_NAME/actions/permissions" \
            -F enabled=false --silent

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          push_ref() {
            GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            GIT_CONFIG_KEY_1=http.version \
            GIT_CONFIG_VALUE_1=HTTP/1.1 \
              git -C source.git push --force "$target" "$1:$2"
          }

          git ls-remote --refs --heads --tags "$target" \
            | awk '{print $1, $2}' | sort > previous-refs.txt
          declare -A previous_refs=()
          while read -r oid ref; do
            previous_refs["$ref"]="$oid"
          done < previous-refs.txt

          # Send each ref separately. If one branch is too large for GitHub's
          # 2 GiB push limit, recursively send commits along its history.
          push_commits() {
            local first=$1 last=$2 destination=$3 middle attempt
            if push_ref "${commits[$last]}" "$destination"; then
              sleep 10
              return 0
            fi
            if (( first == last )); then
              for attempt in 2 3; do
                sleep "$((attempt * 15))"
                if push_ref "${commits[$last]}" "$destination"; then
                  sleep 10
                  return 0
                fi
              done
              echo "Failed to push commit ${commits[$last]} to $destination." >&2
              return 1
            fi
            middle=$(((first + last) / 2))
            push_commits "$first" "$middle" "$destination"
            push_commits "$((middle + 1))" "$last" "$destination"
          }

          while read -r oid ref; do
            [[ "$ref" == refs/heads/* ]] || continue
            [[ "${previous_refs[$ref]:-}" == "$oid" ]] && continue
            mapfile -t commits < <(git -C source.git rev-list --topo-order --reverse "$ref")
            test "${#commits[@]}" -gt 0
            push_commits 0 "$((${#commits[@]} - 1))" "$ref"
          done < local-refs.txt

          while read -r oid ref; do
            [[ "$ref" == refs/tags/* ]] || continue
            [[ "${previous_refs[$ref]:-}" == "$oid" ]] && continue
            pushed=false
            for attempt in 1 2 3; do
              if push_ref "$ref" "$ref"; then
                pushed=true
                sleep 10
                break
              fi
              sleep "$((attempt * 15))"
            done
            test "$pushed" = true
          done < local-refs.txt

          default_ref=$(git -c protocol.version=1 ls-remote --symref "$SOURCE_URL" HEAD \
            | awk '$1 == "ref:" && $3 == "HEAD" {print $2}' || true)
          if [ -z "$default_ref" ]; then
            for candidate in main master; do
              if git -C source.git show-ref --verify --quiet "refs/heads/$candidate"; then
                default_ref="refs/heads/$candidate"
                break
              fi
            done
          fi
          if [[ "$default_ref" == refs/heads/* ]]; then
            gh api -X PATCH "repos/$org/$SOURCE_NAME" \
              -f "default_branch=${default_ref#refs/heads/}" --silent
          fi

          # Delete refs removed upstream only after all current refs arrived.
          while read -r oid ref; do
            if ! git -C source.git show-ref --verify --quiet "$ref"; then
              push_ref '' "$ref"
              sleep 10
            fi
          done < previous-refs.txt

          git ls-remote --refs --heads --tags "$target" \
            | awk '{print $1, $2}' | sort > target-refs.txt
          diff -u local-refs.txt target-refs.txt
